
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINE Restaurant | Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1c1c1c;
            color: white;
        }

        /*
         * Display the complete background image.
         * The image scales to the browser width without cropping.
         */
        .restaurant-background {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("{% static 'images/front_view.jpg' %}");
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% auto;
            background-color: #1c1c1c;
        }

        /* Navigation remains above the background image. */
        .top-navigation {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 12px;
        }

        .top-navigation a {
            display: inline-block;
            padding: 11px 20px;
            background-color: #df123d;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            border-radius: 7px;
            transition: background-color 0.2s;
        }

        .top-navigation a:hover {
            background-color: #a50d2d;
        }

        /*
         * Transparent content area positioned over
         * the central black slate board in the image.
         */
        .board-content {
            position: absolute;
            top: 19%;
            left: 50.8%;
            transform: translateX(-50%);

            width: 38%;
            min-width: 260px;
            max-width: 520px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;

            padding: 8px 12px 18px;
            text-align: center;
            background: transparent;
        }

        .restaurant-logo {
            display: block;
            width: min(58%, 210px);
            max-width: 100%;
            height: auto;
            max-height: 105px;
            object-fit: contain;
            margin: 0 auto 2px;
        }

        .menu-heading {
            margin: 0;
            padding: 8px 14px;
            color: #ffffff;
            background: #06413c;
            border-radius: 8px;
            font-size: clamp(20px, 2.2vw, 30px);
            font-style: italic;
            font-weight: 600;
        }

        .category-links {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            width: 100%;
        }

        .category-links a {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 39px;
            padding: 8px 5px;

            background: #1670f8;
            color: #ffffff;
            border-radius: 7px;
            text-decoration: none;
            font-size: clamp(11px, 1.1vw, 15px);
            font-weight: 600;
            overflow-wrap: anywhere;

            transition: background-color 0.2s;
        }

        .category-links a:hover {
            background: #0848a9;
        }

        .category-links a:last-child {
            grid-column: 1 / -1;
        }

        /* Medium screens */
        @media (max-width: 900px) {
            .top-navigation {
                padding: 10px;
                gap: 8px;
            }

            .top-navigation a {
                padding: 9px 15px;
            }

            .board-content {
                top: 18%;
                width: 40%;
                min-width: 0;
                gap: 9px;
                padding: 4px 6px 10px;
            }

            .restaurant-logo {
                width: 58%;
                max-height: 75px;
            }

            .menu-heading {
                font-size: clamp(17px, 2.6vw, 24px);
                padding: 6px 10px;
            }

            .category-links {
                gap: 6px;
            }

            .category-links a {
                min-height: 32px;
                padding: 5px 3px;
            }
        }

        /* Mobile screens */
        @media (max-width: 560px) {
            /*
             * On narrow screens, keep the complete image visible
             * and place content in a readable layout below it.
             */
            .restaurant-background {
                min-height: 100vh;
                padding-bottom: 24px;
                background-size: auto 310px;
                background-position: top center;
            }

            .top-navigation {
                padding: 10px 8px;
            }

            .board-content {
                position: relative;
                top: auto;
                left: auto;
                transform: none;

                width: calc(100% - 28px);
                max-width: 380px;
                margin: 30px auto 0;
                padding: 20px 14px;

                background: rgba(24, 24, 24, 0.94);
                border-radius: 12px;
                gap: 15px;
            }

            .restaurant-logo {
                width: min(65%, 200px);
                max-height: 110px;
            }

            .menu-heading {
                font-size: 25px;
            }

            .category-links {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .category-links a {
                min-height: 44px;
                font-size: 14px;
                padding: 10px;
            }

            .category-links a:last-child {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <main class="restaurant-background">

        <nav class="top-navigation" aria-label="Main navigation">
            <a href="{% url 'menu_view' %}">Menu</a>
            <a href="{% url 'create_review' %}">Feedback</a>
        </nav>

        <section class="board-content">

            <img
                src="{% static 'images/Mine_logo.png' %}"
                alt="MINE Restaurant logo"
                class="restaurant-logo"
            >

            <h1 class="menu-heading">Our Menu</h1>

            <nav class="category-links" aria-label="Menu categories">

                <a href="{% url 'menu_category' 'BREAKFAST' %}">
                    Breakfast
                </a>

                <a href="{% url 'menu_category' 'VEG' %}">
                    Vegetarian
                </a>

                <a href="{% url 'menu_category' 'NON_VEG' %}">
                    Non-Vegetarian
                </a>

                <a href="{% url 'menu_category' 'STARTERS' %}">
                    Starters
                </a>

                <a href="{% url 'menu_category' 'ICE_CREAM' %}">
                    Ice Cream
                </a>

            </nav>

        </section>

    </main>

</body>
</html>
