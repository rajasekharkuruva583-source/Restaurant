<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <h2 class="mt-5">Your Selected Items</h2>

        <!-- Debug line -->
        <p>Session IDs: {{ request.session.selected_items }}</p>

        {% if selected_items %}
        <ul class="list-group">
            {% for dish in selected_items %}
            <li class="list-group-item">
                {{ dish.name }} - ₹{{ dish.price }}
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>No items selected yet.</p>
        {% endif %}

    </center>

</body>

</html>
