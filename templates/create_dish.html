<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: linear-gradient(to right, #ea5f6a 0%, #ea5f6a 100%);
        }
        .admin-logo {
            display: block;
            width: 110px;
            max-width: 35vw;
            max-height: 75px;
            object-fit: contain;
            margin: 20px auto 8px;
        }
        h1
        {
            padding: 15px;
            background-color:goldenrod;
            color: white;
            font-style: oblique;
           margin: 10px 500px 10px 500px;
           border-radius: 35px 0px;
        }
        .btn2
        {
            color: white;
            background-color:firebrick;
            padding: 10px;
            border-radius: 10px;
        }
        .btn2:hover{
            cursor: pointer;
            transform: scale(1.05);
            background-color: green;
            color: white;
        }

    </style>
</head>
<body>
    <center>
        <a href="{% url 'menu_view' %}" aria-label="Mine's Restaurant home">
            <img src="{% static 'images/Mine_logo.png' %}" alt="Mine's Restaurant logo" class="admin-logo">
        </a>
        <h1>Insert Dish</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{form.as_p}}
            <input type="submit" value="create Dish" class="btn2">
        </form>
    </center>
</body>
</html>
